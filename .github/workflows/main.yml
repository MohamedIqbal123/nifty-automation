name: NSE Bridge

on:
  workflow_dispatch:

  schedule:
    - cron: "35 2 * * 1-5"
    - cron: "35-41 3 * * 1-5"
    - cron: "15,20,25 10 * * 1-5"
    - cron: "30 10 * * 1-5"

# Times above are UTC. India time = UTC + 5:30
#   35 2        -> 8:05 AM IST  (morning CSV)
#   35-41 3     -> 9:05 to 9:11 AM IST (pre-market value)
#   15,20,25 10 -> 3:45, 3:50, 3:55 PM IST (closing value)
#   30 10       -> 4:00 PM IST (backup closing run)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests playwright

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run NSE bridge
        run: python nse_bridge.py

      - name: Save NSE data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nifty_latest.csv
          git add nse_status.json

          if [ -f premarket.json ]; then
            git add premarket.json
          fi

          git diff --cached --quiet || git commit -m "Update NSE data"
          git push
